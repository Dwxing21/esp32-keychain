[env:esp32-s3-lcd-1.28]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; This is the standard trick to feed TFT_eSPI a custom pin setup via PlatformIO
; instead of editing the library's own User_Setup_Select.h
build_flags =
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.34
    h2zero/NimBLE-Arduino @ ^1.4.1
    mathertel/OneButton @ ^2.6.1

board_build.partitions = default_16MB.csv

; NOTE on NimBLE versions: this code targets the NimBLE-Arduino 1.4.x callback
; API (onWrite(NimBLECharacteristic*), no NimBLEConnInfo parameter). If PlatformIO
; pulls in NimBLE-Arduino 2.x instead, the callback signatures changed and you'll
; get "does not override" compile errors -- pin the version above if that happens.
